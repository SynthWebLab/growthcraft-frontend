name: Deploy Dev Frontend

on:
  push:
    branches:
      - dev-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Generate .env file
        working-directory: ./frontend
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Build Next.js app
        working-directory: ./frontend
        run: npm run build

      - name: Pull latest code on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/growthcraft-frontend
            git pull origin dev-frontend

      - name: Copy build artifacts to EC2 via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend/.next,frontend/.env"
          target: "/home/ubuntu/growthcraft-frontend/frontend" 
          strip_components: 1

      - name: Install dependencies & Restart Service via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/growthcraft-frontend/frontend
            npm ci --production
            sudo systemctl restart growth-frontend
