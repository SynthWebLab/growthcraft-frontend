name: Deploy Frontend

on:
  push:
    branches:
      - dev-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Generate .env file
        working-directory: ./frontend
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Build Next.js app
        working-directory: ./frontend
        run: npm run build

      - name: Transfer Files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend/.next,frontend/public,frontend/package.json,frontend/package-lock.json,frontend/next.config.ts,frontend/.env"
          target: "/home/ubuntu/growthcraft-frontend"
          strip_components: 1

      - name: Execute Deployment on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /home/ubuntu/growthcraft-frontend

            # Install dependencies
            npm ci

            # Restart the systemd service
            sudo systemctl daemon-reload
            sudo systemctl restart growth-frontend
