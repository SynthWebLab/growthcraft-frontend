name: Deploy Frontend

on:
  push:
    branches:
      - dev-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Generate .env file
        working-directory: ./frontend
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Build Next.js app
        working-directory: ./frontend
        run: npm run build

      - name: Free Disk Space on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "=== Initial Disk Space ==="
            df -h
            
            # Ensure folder exists and clean up old heavy directories to free disk space
            mkdir -p /home/${{ secrets.EC2_USERNAME }}/growthcraft-frontend
            
            # Stop the systemd service first to release files in use and free locked disk space
            echo "=== Stopping service to release file handles ==="
            sudo systemctl stop growth-frontend || true
            
            echo "=== Cleaning up node_modules and next cache ==="
            sudo rm -rf /home/${{ secrets.EC2_USERNAME }}/growthcraft-frontend/node_modules || true
            sudo rm -rf /home/${{ secrets.EC2_USERNAME }}/growthcraft-frontend/.next/cache || true
            
            echo "=== Cleaning npm cache ==="
            rm -rf /home/${{ secrets.EC2_USERNAME }}/.npm || true
            
            echo "=== Cleaning system package cache ==="
            sudo apt-get autoremove -y || true
            sudo apt-get clean || true
            
            echo "=== Vacuuming systemd journal logs ==="
            sudo journalctl --vacuum-size=50M || true
            sudo journalctl --vacuum-time=1d || true
            
            echo "=== Cleaning rotated and large active log files ==="
            sudo find /var/log -type f -name "*.gz" -delete || true
            sudo find /var/log -type f -name "*.1" -delete || true
            sudo find /var/log -type f -name "*.log" -size +10M -exec truncate -s 0 {} \; || true
            
            echo "=== Cleaning /tmp ==="
            sudo rm -rf /tmp/* || true
            
            if command -v pm2 &> /dev/null; then
              echo "=== Cleaning PM2 logs ==="
              pm2 flush || true
            fi
            
            echo "=== Checking and cleaning Docker resources (if present) ==="
            if command -v docker &> /dev/null; then
              sudo docker system prune -af --volumes || true
              sudo docker builder prune -af || true
            fi
            
            echo "=== Top Space Consumers ==="
            sudo du -hxd 1 /var /home /usr /opt 2>/dev/null | sort -rh || true
            sudo du -hxd 2 /home /var/log 2>/dev/null | sort -rh | head -n 15 || true
            
            echo "=== Disk Space After Cleanup ==="
            df -h

      - name: Transfer Files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend/.next,frontend/public,frontend/package.json,frontend/package-lock.json,frontend/next.config.ts,frontend/.env"
          target: "/home/${{ secrets.EC2_USERNAME }}/growthcraft-frontend"
          strip_components: 1
          overwrite: true
          debug: true

      - name: Execute Deployment on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "=== Disk Space before npm ci ==="
            df -h

            cd /home/${{ secrets.EC2_USERNAME }}/growthcraft-frontend

            # Clean npm cache and install production-only dependencies using /tmp for cache
            rm -rf /home/${{ secrets.EC2_USERNAME }}/.npm || true
            npm ci --omit=dev --cache=/tmp/npm-cache --prefer-offline --no-audit --no-fund

            # Restart the systemd service
            sudo systemctl daemon-reload
            sudo systemctl restart growth-frontend
            
            echo "=== Disk Space after deployment ==="
            df -h
